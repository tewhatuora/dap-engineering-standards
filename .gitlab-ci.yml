pages:
  stage: deploy
  image: astral/uv:python3.13-trixie
  script:
    # - curl -fsSL https://raw.githubusercontent.com/mklement0/n-install/stable/bin/n-install | bash -s -- -y 24
    # - export N_PREFIX="$HOME/n"
    # - export PATH="$N_PREFIX/bin:$PATH"
    # - npm install
    # - DEBUG=puppeteer:* npx puppeteer browsers install chrome-headless-shell
    - uv sync
    - uv run mkdocs build --site-dir public
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - ~/.cache/ 
  pages:
    publish: public
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
