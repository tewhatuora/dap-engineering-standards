site_name: HealthNZ Engineering Standards
site_url: https://notsureyet.com
plugins:
  - include-markdown
  - meta
  #- optimize  # Disabled due to dependency installation complexity (eg Cairo Graphics native dependencies)
  - privacy
  - search
theme:
  name: material
  features:
    - navigation.indexes
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - toc.follow
  logo: assets/two.svg
  favicon: assets/favicon-32x32.png
  palette:
    primary: custom
  custom_dir: theme-overrides
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
