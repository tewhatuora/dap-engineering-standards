site_name: Health New Zealand Engineering Standards
site_url: https://dap-engineering-standards-6efaca.gitlab.io/
exclude_docs: |
  **/AGENTS.md
plugins:
  - include-markdown
  - meta
  #- optimize  # Disabled due to dependency installation complexity (eg Cairo Graphics native dependencies)
  - privacy:
      assets_exclude:
        # Material loads Mermaid from this URL at runtime. The privacy plugin
        # rewrites it to site_url + the original URL, which 404s, so diagrams
        # render as raw code. Leave it alone.
        - unpkg.com/mermaid@11/*
  - search
  - glightbox:
      width: 90%
      height: auto
  # - mermaid-to-svg:
  #     image_id_enabled: true
  #     image_id_prefix: mermaid-diagram
  #     # Disable HTML labels for PDF compatibility
  #     mermaid_config:
  #       htmlLabels: false
  #       flowchart:
  #         htmlLabels: false
  #       class:
  #         htmlLabels: false
  # - to-pdf:  # When used with PDF generation plugins
  #     enabled_if_env: ENABLE_PDF_EXPORT
theme:
  name: material
  features:
    - navigation.indexes
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - toc.follow
  logo: assets/two.svg
  favicon: assets/favicon-32x32.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Use system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  custom_dir: theme-overrides
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mermaid-glightbox.js
  - assets/javascripts/section-disclosures.js
markdown_extensions:
  # - attr_list
  - toc:
      toc_depth: "1-2"   # include H1 and H2 only, hide H3+
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
