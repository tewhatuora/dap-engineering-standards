site_name: Health New Zealand Engineering Standards
site_url: https://dap-engineering-standards-6efaca.gitlab.io/
plugins:
  - include-markdown
  - meta
  #- optimize  # Disabled due to dependency installation complexity (eg Cairo Graphics native dependencies)
  - privacy
  - search
  # - mermaid-to-svg:
  #     image_id_enabled: true
  #     image_id_prefix: mermaid-diagram
  #     # Disable HTML labels for PDF compatibility
  #     mermaid_config:
  #       htmlLabels: false
  #       flowchart:
  #         htmlLabels: false
  #       class:
  #         htmlLabels: false
  # - to-pdf:  # When used with PDF generation plugins
  #     enabled_if_env: ENABLE_PDF_EXPORT
theme:
  name: material
  features:
    - navigation.indexes
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    - toc.follow
  logo: assets/two.svg
  favicon: assets/favicon-32x32.png
  palette:
    primary: custom
  custom_dir: theme-overrides
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  # - attr_list
  - toc:
      toc_depth: "2-3"   # include H2 and H3 only, hide H4+
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
