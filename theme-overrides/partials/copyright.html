<div class="md-copyright">
  <div class="site-footer-meta">
    {% if page and page.meta and page.meta.last_edited %}
      Last edited
      <time datetime="{{ page.meta.last_edited }}">{{ page.meta.last_edited }}</time>
    {% else %}
      Last edited: not set
    {% endif %}
  </div>
  {% if config.copyright %}
    <div class="md-copyright__highlight">
      {{ config.copyright }}
    </div>
  {% endif %}
  {% if not config.extra.generator == false %}
    Made with
    <a href="https://squidfunk.github.io/mkdocs-material/" target="_blank" rel="noopener">
      Material for MkDocs
    </a>
  {% endif %}
</div>
